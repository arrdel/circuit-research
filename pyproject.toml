[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit"
version = "0.1.0"
description = "CIRCUIT: Causal Interpretability and Reasoning Under Controlled Interventions in Diffusion Transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "diffusers>=0.32.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "safetensors>=0.4.0",
    "einops>=0.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "sentencepiece>=0.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
demo = ["gradio>=4.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "benchmark*",
    "models*",
    "instrumentation*",
    "interpretability*",
    "interventions*",
    "evaluation*",
    "visualization*",
    "experiments*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
